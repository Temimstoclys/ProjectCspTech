name: TestSpec

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Chrome e ChromeDriver
        uses: browser-actions/setup-chrome@v1

      - name: Verificar versão do Chrome
        run: chrome --version

      - name: Verificar versão do ChromeDriver
        run: chromedriver --version

      - name: Executar testes com Maven
        run: mvn clean test -Dbrowser=chrome

      - name: Gerar relatório HTML do Cucumber
        run: mvn verify

      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-html
          path: target/cucumber-report-html

      - name: Publicar logs de falhas (surefire)
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: surefire-reports
            path: target/surefire-reports
