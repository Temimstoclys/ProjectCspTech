name: TestSpec

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Chrome e ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://storage.googleapis.com/chrome-for-testing-public/114.0.5735.90/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          sudo apt-get install -y google-chrome-stable || true  # Chrome pode já estar instalado

      - name: Verificar versão do Chrome
        run: google-chrome --version

      - name: Verificar versão do ChromeDriver
        run: chromedriver --version

      - name: Executar testes com Maven
        run: mvn clean test -Dbrowser=chrome

      - name: Gerar relatório HTML do Cucumber
        run: mvn verify

      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-html
          path: target/cucumber-report-html
