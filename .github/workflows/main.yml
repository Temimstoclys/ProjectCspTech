name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências e Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip xvfb libxi6 default-jdk google-chrome-stable

      - name: Detectar versão do Chrome e baixar ChromeDriver compatível
        run: |
          # Detectar a versão do Chrome instalada
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          echo "Versão do Chrome instalada: $CHROME_VERSION"

          # Baixar o ChromeDriver correspondente à versão do Chrome
          DRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/136.0.7103.49/linux64/chromedriver-linux64.zip"
          echo "Baixando ChromeDriver versão $CHROME_VERSION..."
          wget $DRIVER_URL -O chromedriver.zip
          unzip chromedriver.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Verificar versões
        run: |
          google-chrome --version
          chromedriver --version

      - name: Executar testes com Maven
        run: mvn clean test -Dbrowser=chrome

      - name: Gerar relatório HTML do Cucumber
        run: mvn verify

      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-html
          path: target/cucumber-report-html
