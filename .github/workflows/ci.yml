name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Checkout do código
      - name: Checkout do código
        uses: actions/checkout@v3

      # Passo 2: Configurar o Java 17
      - name: Configurar o Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Passo 3: Verificar versão do Maven
      - name: Verificar versão do Maven
        run: mvn --version

      # Passo 4: Rodar testes com Maven
      - name: Rodar testes com Maven
        run: mvn clean test

      # Passo 5: Gerar relatório de teste (apenas se necessário)
      - name: Gerar relatório de testes Cucumber
        run: mvn surefire-report:report
