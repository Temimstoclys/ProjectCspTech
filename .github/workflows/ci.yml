name: CI - Testes Automatizados

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout do código
        uses: actions/checkout@v3

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Verificar versão do Maven
        run: mvn --version

      - name: 🧪 Executar testes com Maven
        run: mvn clean test

      - name: 📂 Listar conteúdo da pasta target
        run: ls -R target

      - name: 📤 Fazer upload do relatório Cucumber HTML
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html
